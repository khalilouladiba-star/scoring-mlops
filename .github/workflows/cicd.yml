name: CI/CD - API de Scoring

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier que le modele champion est present
        run: test -f models/champion_model.pkl

      - name: Installer pytest
        run: pip install pytest httpx

      - name: Lancer les tests de l API
        run: pytest tests/ -v
